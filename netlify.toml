# Netlify was the previous host. Cloudflare Pages now serves marketinginaction.xyz
# (tools/cf-build.sh), and Netlify builds are stopped. This file stays only so
# Netlify can serve as a fallback until that decision is made; it runs the same
# checks as the Cloudflare build and the GitHub Pages workflow.
[build]
  publish = "."
  # set -e stops the build at the first failing step.
  # 1. Full git history, so the sitemap dates each page from its last commit.
  # 2. The four checks: calculators, template wording, Open Graph tags, ad bridges, DIME proof figures.
  # 3. Rebuild sitemap-main.xml from the pages on disk.
  command = """
    set -e
    if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then git fetch --unshallow --quiet || true; fi
    python3 tools/verify-calculators.py
    python3 tools/check-wording.py
    python3 tools/check-og.py
    python3 tools/check-bridges.py
    python3 tools/dime-proof.py
    python3 tools/generate-sitemap.py --base-url https://marketinginaction.xyz/ --output sitemap-main.xml
  """
