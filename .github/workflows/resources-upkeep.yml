# Keeps the events calendar and the tools database current, every Monday at
# 06:00 Lagos time, with no manual step and no dependence on James's Mac.
# tools/resources/upkeep.py moves ended events out, reads each official site
# for next-edition dates and moved dates, and on the first run of each month
# checks every tool's website (dead sites are hidden, pivots are flagged).
# Every run also reads each thought leader's newsletter or blog feed and saves
# their latest post, so the page can show it and move quiet writers down.
# Anything that needs James's yes or no goes to data/resources/review.json,
# which the 17:00 intake run reports in the daily digest. The pages are then
# rebuilt and committed, and Cloudflare Pages deploys the push.
name: Resources upkeep

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      tools:
        description: "Also run the monthly tools check now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: "resources-upkeep"
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run upkeep
        run: python3 tools/resources/upkeep.py ${{ inputs.tools && '--tools' || '' }}
      - name: Rebuild and check the pages
        run: |
          python3 tools/resources/build.py --write
          python3 tools/resources/build.py --check
      - name: Commit and push
        run: |
          git config user.name "MIA resources upkeep"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources resources/tech-events-calendar resources/marketing-ai-tools resources/marketing-thought-leaders
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Resources upkeep $(date -u +%F)"
          git pull --rebase
          git push
