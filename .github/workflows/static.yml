# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment. Do NOT cancel an in-progress run — a Pages deploy that is
# mid-publish should be allowed to finish, otherwise a newer push can abort a production deploy
# and leave the site un-updated. (This is the official GitHub Pages starter setting; changing it
# to cancel-in-progress:true is what caused the Aug-2026 deploy failures.)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: generate-sitemap.py dates each <lastmod> from the file's
          # last commit. A shallow clone would collapse every page to one date.
          fetch-depth: 0
      - name: Generate sitemap
        # sitemap-main.xml is a derived artifact, rebuilt from the pages actually
        # on disk so it can never drift from the site. Regenerating here (rather
        # than failing the build on a stale file) means a forgotten commit still
        # deploys a correct sitemap. sitemap.xml is the hand-written index that
        # points at this file plus the newsletter subdomain, so it is left alone.
        run: python3 tools/generate-sitemap.py --base-url https://marketinginaction.xyz/ --output sitemap-main.xml
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
